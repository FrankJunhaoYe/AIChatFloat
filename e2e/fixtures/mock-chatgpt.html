<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock ChatGPT</title>
  </head>
  <body>
    <main>
      <article data-message-author-role="user">
        <div class="whitespace-pre-wrap">Hello, what is WXT?</div>
      </article>
      <article data-message-author-role="assistant">
        <div class="markdown">WXT is a framework for building browser extensions.</div>
      </article>
    </main>
    <div id="prompt-textarea" contenteditable="true" data-placeholder="Message ChatGPT"></div>
  </body>
</html>
